<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f4f1e8; font-family: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive; color: #2b2a28; }
    a { color: #b5412c; } a:hover { color: #8f3221; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; padding: 20px 16px 24px 16px; display: flex; flex-direction: column; gap: 14px; background: #f4f1e8;">

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <div style="font-size: 24px; line-height: 28px;">Replay</div>
    <div style="font-size: 14px; line-height: 18px; color: #6b6860;">Mustard, Green, Plum. Green solved it on turn 11.</div>
  </div>

  <div style="display: flex; justify-content: center;">
    <svg width="358" height="358" viewBox="0 0 300 300" fill="none" stroke="#2b2a28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" font-family="Patrick Hand, Segoe Print, cursive" font-size="11">
      <polygon points="150,40 221,66 258,131 245,205 188,253 112,253 55,205 42,131 79,66" />
      <line x1="150" y1="40" x2="112" y2="253" stroke-dasharray="4 4" />
      <line x1="258" y1="131" x2="42" y2="131" stroke-dasharray="4 4" />
      <rect x="121" y="29" width="58" height="22" rx="4" fill="#f4f1e8" /><text x="150" y="44" text-anchor="middle" fill="#2b2a28" stroke="none">Kitchen</text>
      <rect x="192" y="55" width="58" height="22" rx="4" fill="#f4f1e8" /><text x="221" y="70" text-anchor="middle" fill="#2b2a28" stroke="none">Ballroom</text>
      <rect x="229" y="120" width="58" height="22" rx="4" fill="#f4f1e8" /><text x="258" y="135" text-anchor="middle" fill="#2b2a28" stroke="none">Conserv.</text>
      <rect x="216" y="194" width="58" height="22" rx="4" fill="#f4f1e8" /><text x="245" y="209" text-anchor="middle" fill="#2b2a28" stroke="none">Billiard</text>
      <rect x="159" y="242" width="58" height="22" rx="4" fill="#f4f1e8" /><text x="188" y="257" text-anchor="middle" fill="#2b2a28" stroke="none">Library</text>
      <rect x="83" y="242" width="58" height="22" rx="4" fill="#dcd8cc" /><text x="112" y="257" text-anchor="middle" fill="#2b2a28" stroke="none">Study</text>
      <rect x="26" y="194" width="58" height="22" rx="4" fill="#f4f1e8" /><text x="55" y="209" text-anchor="middle" fill="#2b2a28" stroke="none">Hall</text>
      <rect x="13" y="120" width="58" height="22" rx="4" fill="#f4f1e8" /><text x="42" y="135" text-anchor="middle" fill="#2b2a28" stroke="none">Lounge</text>
      <rect x="50" y="55" width="58" height="22" rx="4" fill="#f4f1e8" /><text x="79" y="70" text-anchor="middle" fill="#2b2a28" stroke="none">Dining</text>
      <circle cx="100" cy="230" r="9" fill="#f4f1e8" /><text x="100" y="234" text-anchor="middle" fill="#2b2a28" stroke="none">M</text>
      <circle cx="124" cy="230" r="9" fill="#2b2a28" /><text x="124" y="234" text-anchor="middle" fill="#f4f1e8" stroke="none">P</text>
      <circle cx="232" cy="84" r="9" fill="#f4f1e8" /><text x="232" y="88" text-anchor="middle" fill="#2b2a28" stroke="none">G</text>
      <path d="M 50 150 L 218 150 Q 226 150 226 158 L 226 188 Q 226 196 218 196 L 110 196 L 100 214 L 96 196 L 50 196 Q 42 196 42 188 L 42 158 Q 42 150 50 150 Z" fill="#faf8f2" />
      <text x="52" y="168" fill="#2b2a28" stroke="none" font-size="12">Mustard: “White, with the knife,</text>
      <text x="52" y="184" fill="#2b2a28" stroke="none" font-size="12">in the Study?”</text>
      <rect x="196" y="98" width="92" height="20" rx="10" fill="#2b2a28" /><text x="242" y="112" text-anchor="middle" fill="#f4f1e8" stroke="none" font-size="11">Green shows White</text>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 64px; font-size: 15px;">Mustard</span>
      <div style="flex: 1; display: flex; height: 18px; border: 1.5px solid #2b2a28; border-radius: 3px; overflow: hidden;">
        <div style="flex: 1; display: flex; border-right: 3px solid #2b2a28;"><div style="flex: 0 0 25%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 25%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 25%; background: #dcd8cc; border-right: 1px solid #2b2a28; box-shadow: inset 0 -3px 0 #b5412c;"></div><div style="flex: 0 0 25%; background: #dcd8cc;"></div></div>
        <div style="flex: 1; display: flex; border-right: 3px solid #2b2a28;"><div style="flex: 0 0 20%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 20%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 20%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 20%; background: #dcd8cc; border-right: 1px solid #2b2a28; box-shadow: inset 0 -3px 0 #b5412c;"></div><div style="flex: 0 0 20%; background: #dcd8cc;"></div></div>
        <div style="flex: 1; display: flex;"><div style="flex: 0 0 63%; background: #dcd8cc; border-right: 1px solid #2b2a28; box-shadow: inset 0 -3px 0 #b5412c;"></div><div style="flex: 0 0 18%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 19%; background: #dcd8cc;"></div></div>
      </div>
      <span style="width: 40px; text-align: right; font-size: 13px; color: #6b6860;">9/21</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 64px; font-size: 15px;">Green</span>
      <div style="flex: 1; display: flex; height: 18px; border: 1.5px solid #2b2a28; border-radius: 3px; overflow: hidden;">
        <div style="flex: 1; display: flex; border-right: 3px solid #2b2a28;"><div style="flex: 0 0 50%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 50%; background: #dcd8cc; box-shadow: inset 0 -3px 0 #b5412c;"></div></div>
        <div style="flex: 1; display: flex; border-right: 3px solid #2b2a28;"><div style="flex: 0 0 50%; background: #dcd8cc; border-right: 1px solid #2b2a28; box-shadow: inset 0 -3px 0 #b5412c;"></div><div style="flex: 0 0 17%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 17%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 16%; background: #dcd8cc;"></div></div>
        <div style="flex: 1; display: flex;"><div style="flex: 0 0 30%; background: #dcd8cc; border-right: 1px solid #2b2a28; box-shadow: inset 0 -3px 0 #b5412c;"></div><div style="flex: 0 0 26%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 9%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 9%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 9%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 9%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 8%; background: #dcd8cc;"></div></div>
      </div>
      <span style="width: 40px; text-align: right; font-size: 13px; color: #6b6860;">8/21</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 64px; font-size: 15px;">Plum</span>
      <div style="flex: 1; display: flex; height: 18px; border: 1.5px solid #2b2a28; border-radius: 3px; overflow: hidden;">
        <div style="flex: 1; display: flex; border-right: 3px solid #2b2a28;"><div style="flex: 0 0 40%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 40%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 20%; background: #dcd8cc; box-shadow: inset 0 -3px 0 #b5412c;"></div></div>
        <div style="flex: 1; display: flex; border-right: 3px solid #2b2a28;"><div style="flex: 0 0 100%; background: #2b2a28; box-shadow: inset 0 -3px 0 #b5412c;"></div></div>
        <div style="flex: 1; display: flex;"><div style="flex: 0 0 56%; background: #dcd8cc; border-right: 1px solid #2b2a28; box-shadow: inset 0 -3px 0 #b5412c;"></div><div style="flex: 0 0 10%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 10%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 10%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 10%; background: #dcd8cc; border-right: 1px solid #2b2a28;"></div><div style="flex: 0 0 4%; background: #dcd8cc;"></div></div>
      </div>
      <span style="width: 40px; text-align: right; font-size: 13px; color: #6b6860;">12/21</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6b6860;">
      <span style="width: 64px;"></span>
      <div style="flex: 1; display: flex;"><span style="flex: 1; text-align: center;">suspect</span><span style="flex: 1; text-align: center;">weapon</span><span style="flex: 1; text-align: center;">room</span></div>
      <span style="width: 40px; text-align: right;">placed</span>
    </div>
  </div>

  <div style="font-size: 12px; line-height: 16px; color: #6b6860;">solid = proven by the floor · pale = still plausible, as wide as the belief · red = the truth. Tap a seat to open it.</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
    <div style="position: relative; height: 44px;">
      <div style="position: absolute; left: 0; right: 0; top: 21px; height: 2px; background: #2b2a28;"></div>
      <div style="position: absolute; left: 0; top: 16px; width: 2px; height: 12px; background: #2b2a28;"></div>
      <div style="position: absolute; right: 0; top: 16px; width: 2px; height: 12px; background: #2b2a28;"></div>
      <div style="position: absolute; left: 88%; top: 8px; width: 28px; height: 28px; margin-left: -14px; border: 1.5px solid #2b2a28; border-radius: 50%; background: #f4f1e8; box-sizing: border-box;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6b6860;"><span>turn 1</span><span>10 of 11</span></div>
  </div>

</div>
</x-dc>
</body>
</html>
